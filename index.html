<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Blossom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0208;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .title {
            position: absolute;
            top: 30px;
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 10;
            user-select: none;
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.8);
        }
    </style>
</head>
<body>

    <div class="title">Interactive Blossom</div>
    <canvas id="blossomCanvas"></canvas>

    <script>
        const canvas = document.getElementById('blossomCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let flowers = [];
        let particles = [];

        // Класс летающих светящихся сердечек/частиц
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 6 + 4;
                this.speedY = Math.random() * 1.5 + 0.5;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.8;
                this.opacity = Math.random() * 0.7 + 0.3;
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                if (this.y < -20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ff2a6d';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff2a6d';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Класс цветка
        class Flower {
            constructor(x, targetHeight) {
                this.x = x;
                this.targetHeight = targetHeight;
                this.currentHeight = 0;
                this.stemSpeed = 3;
                this.bloomProgress = 0;
                this.petals = 6;
                this.isStemDone = false;
            }

            update() {
                if (this.currentHeight < this.targetHeight) {
                    this.currentHeight += this.stemSpeed;
                } else {
                    this.isStemDone = true;
                    if (this.bloomProgress < 1) {
                        this.bloomProgress += 0.02;
                    }
                }
            }

            draw() {
                const startY = canvas.height;
                const endY = canvas.height - this.currentHeight;

                // Рисуем стебель
                ctx.save();
                ctx.strokeStyle = '#2d5a27';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00ff66';
                ctx.beginPath();
                ctx.moveTo(this.x, startY);
                ctx.quadraticCurveTo(this.x + 10, startY - this.currentHeight / 2, this.x, endY);
                ctx.stroke();
                ctx.restore();

                // Рисуем бутон/лепестки
                if (this.isStemDone) {
                    ctx.save();
                    ctx.translate(this.x, endY);
                    
                    const petalLength = 35 * this.bloomProgress;
                    const petalWidth = 18 * this.bloomProgress;

                    // Лепестки
                    for (let i = 0; i < this.petals; i++) {
                        const angle = (Math.PI * 2 / this.petals) * i;
                        ctx.save();
                        ctx.rotate(angle);
                        
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(petalWidth, -petalLength / 2, 0, -petalLength);
                        ctx.quadraticCurveTo(-petalWidth, -petalLength / 2, 0, 0);
                        
                        ctx.fillStyle = '#ff1493';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#ff69b4';
                        ctx.fill();
                        ctx.restore();
                    }

                    // Центр цветка
                    ctx.beginPath();
                    ctx.arc(0, 0, 10 * this.bloomProgress, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffeb3b';
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#fff';
                    ctx.fill();

                    ctx.restore();
                }
            }
        }

        // Инициализация частичек
        for (let i = 0; i < 40; i++) {
            particles.push(new Particle());
        }

        // Автоматическое появление первого центрального цветка при загрузке
        setTimeout(() => {
            flowers.push(new Flower(canvas.width / 2, 250));
        }, 500);

        // Появление новых цветов при клике / касании
        function addFlower(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const clickY = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
            const targetHeight = canvas.height - clickY;

            if (targetHeight > 50) {
                flowers.push(new Flower(x, targetHeight));
            }
        }

        canvas.addEventListener('click', addFlower);
        canvas.addEventListener('touchstart', (e) => {
            addFlower(e);
        });

        // Анимационный цикл
        function animate() {
            ctx.fillStyle = 'rgba(13, 2, 8, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Анимация частиц
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Анимация цветов
            flowers.forEach(flower => {
                flower.update();
                flower.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
  </html>
